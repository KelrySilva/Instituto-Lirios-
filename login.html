<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Instituto Lírios</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-form-side">
    <form class="login-form" id="formLogin">
      <h1 style="font-size:30px; margin-bottom:4px;">Bem-vinda!</h1>
      <p class="muted" style="margin-bottom:28px;">Faça login para acessar o sistema</p>

      <div class="field-group">
        <label class="field-label">E-mail</label>
        <input class="field-input" id="loginEmail" type="email" placeholder="seu@email.com" autocomplete="username" required>
      </div>
      <div class="field-group">
        <label class="field-label">Senha</label>
        <input class="field-input" id="loginSenha" type="password" placeholder="Sua senha" autocomplete="current-password" required>
      </div>
      <p class="small" style="margin:6px 0 24px;"><a href="esqueci-senha.html" style="color:var(--brown-500); font-weight:600;">Esqueci minha senha</a></p>

      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:13px;">Entrar</button>
    </form>
  </div>

  <div class="login-hero">
    <img class="login-logo" src="assets/logo.png" alt="Dra. Katlhen Carvalho — Cuidando de quem gesta, do bebê e da família">
  </div>
</div>
<script src="assets/banco.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
